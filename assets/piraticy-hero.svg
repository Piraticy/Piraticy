      <stop offset="0.42" stop-color="#102A4C"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="stroke" x1="70" y1="70" x2="1130" y2="398" gradientUnits="userSpaceOnUse">
