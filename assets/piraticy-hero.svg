<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PIRATICy GitHub profile visual</title>
  <desc id="desc">A dark visual profile card for PIRATICy showing project areas and technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#102B4D"/>
      <stop offset="1" stop-color="#0D6B66"/>
    </linearGradient>
    <linearGradient id="line" x1="147" y1="77" x2="1106" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="36" fill="url(#bg)"/>
  <path d="M0 324C142 265 254 355 393 303C545 246 686 333 822 286C960 238 1061 257 1200 199V430H0V324Z" fill="#E0F2FE" opacity="0.1"/>
  <path d="M-20 96H1220M-20 190H1220M-20 284H1220M148 -20V450M318 -20V450M488 -20V450M658 -20V450M828 -20V450M998 -20V450" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="990" cy="93" r="116" fill="#22D3EE" opacity="0.12"/>
  <circle cx="206" cy="342" r="150" fill="#8B5CF6" opacity="0.13"/>

  <g filter="url(#soft)">
    <rect x="70" y="66" width="1060" height="296" rx="30" fill="#07111F" fill-opacity="0.72" stroke="url(#line)" stroke-width="2"/>
  </g>

  <g transform="translate(110 104)">
    <rect x="0" y="0" width="84" height="84" rx="24" fill="url(#chip)"/>
    <path d="M42 18L63 30V54L42 66L21 54V30L42 18Z" stroke="white" stroke-width="5" stroke-linejoin="round"/>
    <path d="M42 18V66M21 30L42 42L63 30" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  </g>

  <text x="220" y="143" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="3">PIRATICy</text>
  <text x="224" y="187" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">TypeScript-first builder from Tanzania</text>
  <text x="224" y="224" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Apps • systems • web tools • games • practical experiments</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="224" y="256" width="116" height="42" rx="21" fill="#1E40AF"/>
    <text x="253" y="283" fill="#DBEAFE">TS</text>
    <rect x="354" y="256" width="116" height="42" rx="21" fill="#854D0E"/>
    <text x="384" y="283" fill="#FEF3C7">JS</text>
    <rect x="484" y="256" width="116" height="42" rx="21" fill="#075985"/>
    <text x="512" y="283" fill="#E0F2FE">PY</text>
    <rect x="614" y="256" width="136" height="42" rx="21" fill="#166534"/>
    <text x="646" y="283" fill="#DCFCE7">HTML/CSS</text>
    <rect x="764" y="256" width="132" height="42" rx="21" fill="#5B21B6"/>
    <text x="800" y="283" fill="#EDE9FE">SQL</text>
    <rect x="910" y="256" width="140" height="42" rx="21" fill="#0F766E"/>
    <text x="947" y="283" fill="#CCFBF1">Prisma</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">
    <rect x="768" y="102" width="276" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.09"/>
    <text x="790" y="130" fill="#E0F2FE" font-size="16">Gym POS System</text>
    <rect x="796" y="159" width="276" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.09"/>
    <text x="818" y="187" fill="#E0F2FE" font-size="16">Beauty Salon Platform</text>
    <rect x="742" y="216" width="276" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.09"/>
    <text x="764" y="244" fill="#E0F2FE" font-size="16">Safari Booking Website</text>
  </g>

  <path d="M145 330H1055" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="145" cy="330" r="8" fill="#60A5FA"/>
  <circle cx="449" cy="330" r="8" fill="#A78BFA"/>
  <circle cx="752" cy="330" r="8" fill="#22D3EE"/>
  <circle cx="1055" cy="330" r="8" fill="#2DD4BF"/>
</svg>
