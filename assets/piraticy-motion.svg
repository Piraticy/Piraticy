<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated project motion board</title>
  <desc id="desc">Animated visual board showing tap, build, and ship gestures for PIRATICy's projects.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="glow" x1="112" y1="152" x2="1088" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="32" fill="url(#panel)"/>
  <path d="M60 64H1140M60 150H1140M60 236H1140M180 20V280M420 20V280M660 20V280M900 20V280" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <text x="78" y="72" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="850">gesture driven workflow</text>
  <text x="78" y="105" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">tap ideas, build systems, ship projects</text>

  <path d="M126 218C307 126 454 250 601 162C771 60 917 178 1064 82" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M126 218C307 126 454 250 601 162C771 60 917 178 1064 82" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.18" stroke-dasharray="70 940">
    <animate attributeName="stroke-dashoffset" values="1010;0" dur="4s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#drop)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="116" y="130" width="228" height="92" rx="24" fill="#0B1220" stroke="#60A5FA" stroke-opacity="0.9"/>
      <text x="146" y="166" fill="#BFDBFE" font-size="18" font-weight="850">tap</text>
      <text x="146" y="195" fill="#E2E8F0" font-size="15" font-weight="650">ideas into screens</text>
      <circle cx="292" cy="164" r="12" fill="none" stroke="#60A5FA" stroke-width="3">
        <animate attributeName="r" values="8;28;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="486" y="96" width="228" height="92" rx="24" fill="#0B1220" stroke="#A78BFA" stroke-opacity="0.9"/>
      <text x="516" y="132" fill="#DDD6FE" font-size="18" font-weight="850">build</text>
      <text x="516" y="161" fill="#E2E8F0" font-size="15" font-weight="650">apps and systems</text>
      <path d="M660 137L676 153L660 169" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="-8 0;8 0;-8 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="856" y="68" width="228" height="92" rx="24" fill="#0B1220" stroke="#2DD4BF" stroke-opacity="0.9"/>
      <text x="886" y="104" fill="#CCFBF1" font-size="18" font-weight="850">ship</text>
      <text x="886" y="133" fill="#E2E8F0" font-size="15" font-weight="650">clean public work</text>
      <path d="M1020 103H1050M1050 103L1038 91M1050 103L1038 115" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="-10 0;10 0;-10 0" dur="2s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(276 144)">
    <path d="M0 0L0 46L14 34L25 58L38 52L27 31H47L0 0Z" fill="#F8FAFC" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="translate" values="276 144;586 114;990 78;276 144" dur="4s" repeatCount="indefinite"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">
    <rect x="80" y="244" width="94" height="30" rx="15" fill="#1E40AF"/>
    <text x="106" y="264" fill="#DBEAFE">TS</text>
    <rect x="184" y="244" width="94" height="30" rx="15" fill="#A16207"/>
    <text x="210" y="264" fill="#FEF3C7">JS</text>
    <rect x="288" y="244" width="94" height="30" rx="15" fill="#0369A1"/>
    <text x="314" y="264" fill="#E0F2FE">PY</text>
    <rect x="392" y="244" width="118" height="30" rx="15" fill="#15803D"/>
    <text x="418" y="264" fill="#DCFCE7">React</text>
    <rect x="520" y="244" width="118" height="30" rx="15" fill="#111827"/>
    <text x="546" y="264" fill="#E5E7EB">Next.js</text>
    <rect x="648" y="244" width="118" height="30" rx="15" fill="#0F766E"/>
    <text x="674" y="264" fill="#CCFBF1">Node</text>
    <rect x="776" y="244" width="118" height="30" rx="15" fill="#6D28D9"/>
    <text x="810" y="264" fill="#EDE9FE">SQL</text>
    <rect x="904" y="244" width="118" height="30" rx="15" fill="#0E7490"/>
    <text x="932" y="264" fill="#CFFAFE">Docker</text>
  </g>
</svg>
